apiVersion: apps/v1
kind: Deployment
metadata:
  name: markethunter-ai
  namespace: markethunter-ai
  labels:
    app.kubernetes.io/name: markethunter-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: markethunter-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: markethunter-ai
    spec:
      containers:
        - name: web
          image: markethunter-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: data, emptyDir: {} }
        - { name: config, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: markethunter-ai
  namespace: markethunter-ai
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: markethunter-ai
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081
